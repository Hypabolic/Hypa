name: CI

on:
  push:
    branches: [main, develop]
    # Skip docs-only changes. CI reads the F2 golden gate, so keep it in scope.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/plans/AgentRuntime/f2-golden-gate.md'
      - '!**/AGENTS.md'
      - '!CLAUDE.md'
      - '!.github/copilot-instructions.md'
  pull_request:
    branches: [main, develop]
    # Skip docs-only changes. CI reads the F2 golden gate, so keep it in scope.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/plans/AgentRuntime/f2-golden-gate.md'
      - '!**/AGENTS.md'
      - '!CLAUDE.md'
      - '!.github/copilot-instructions.md'
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Native-arch runners for the four Unix RIDs. Windows is not a mux host.
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      # Tests start the built hypa apphost. An apphost finds .NET through
      # DOTNET_ROOT, and the macOS runners do not set it.
      - name: Export DOTNET_ROOT
        run: echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # libghostty-vt is built after the suites below, so they keep running
      # without it, as before. The Ghostty gate at the end needs it.
      - name: Build natives
        uses: ./.github/actions/build-natives
        with:
          rid: ${{ matrix.rid }}
          ghostty: 'false'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release /p:TreatWarningsAsErrors=true

      # Explicit build surfaces AgentServer project failures by name.
      # Solution build already includes it; this step keeps logs easy to scan.
      - name: Build (hypa-runtime)
        run: dotnet build src/Hypa.AgentServer/Hypa.AgentServer.csproj --no-restore -c Release

      - name: Test (unit)
        run: dotnet test tests/Hypa.UnitTests/Hypa.UnitTests.csproj --no-build -c Release

      # Hard gate for the agent mux. Failure fails this job (no continue-on-error).
      - name: Test (agent-runtime)
        run: dotnet test tests/Hypa.AgentRuntime.Tests/Hypa.AgentRuntime.Tests.csproj --no-build -c Release

      # Cubes Continuity v0 (C-00…C-21). Builds its own graph (includes Hypa.Cli).
      # Each test class runs in its own process. On the hosted macOS runner a TLS
      # handshake fails in a shared process after earlier certificate and QUIC
      # tests, and every class passes alone. A hung class stops at the step limit.
      - name: Test (continuity)
        timeout-minutes: 20
        run: |
          dotnet build tests/Hypa.Continuity.Tests/Hypa.Continuity.Tests.csproj -c Release
          failed=0
          for cls in $(grep -ho "class [A-Za-z0-9]*Tests" tests/Hypa.Continuity.Tests/*.cs | awk '{print $2}' | sort -u); do
            echo "==> $cls"
            dotnet test tests/Hypa.Continuity.Tests/Hypa.Continuity.Tests.csproj -c Release --no-build --verbosity minimal --filter "Category!=LiveQuic&FullyQualifiedName~.Tests.$cls." || failed=1
          done
          exit $failed

      # A live MsQuic listener on macOS leaves the process unable to export a
      # new RSA key ("The user name or passphrase you entered is not correct").
      # Every later certificate test in that process then fails, so the live
      # tests run in their own process. They do not run on macOS: there the
      # step never gated the job, and on macos-15 it hung until its 10-minute
      # limit on every run.
      - name: Test (continuity, live QUIC)
        if: runner.os != 'macOS'
        timeout-minutes: 10
        run: dotnet test tests/Hypa.Continuity.Tests/Hypa.Continuity.Tests.csproj -c Release --no-build --verbosity minimal --filter "Category=LiveQuic"

      # Point the golden runner at the Release apphost. Without this it falls back
      # to `dotnet run --no-build` (which defaults to Debug) and fails, since this
      # job only builds Release. (.exe suffix on Windows.)
      - name: Test (golden)
        env:
          HYPA_BINARY_PATH: ${{ github.workspace }}/src/Hypa.Cli/bin/Release/net10.0/hypa${{ runner.os == 'Windows' && '.exe' || '' }}
        run: dotnet test tests/Hypa.GoldenTests/Hypa.GoldenTests.csproj --no-build -c Release

      # Hard gate: the Ghostty engine and pane-dispose tests must run, not
      # skip, against the real libghostty-vt and hypa-pty-host.
      - name: Build libghostty-vt
        uses: ./.github/actions/build-natives
        with:
          rid: ${{ matrix.rid }}
          grammar: 'false'
          pty-host: 'false'
          reuse-ghostty: 'true'

      - name: Test (Ghostty engine hard gate)
        run: bash scripts/verify-ghostty-engine-tests.sh

      # Formatting does not depend on the OS. Check it once.
      - name: Format check
        if: matrix.rid == 'linux-x64'
        run: dotnet format --verify-no-changes

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The attach tests start a real mux. The mux requires libghostty-vt and
      # hypa-pty-host next to hypa, so build both before the Release build.
      - name: Build natives
        uses: ./.github/actions/build-natives
        with:
          rid: linux-x64
          grammar: 'false'
          reuse-ghostty: 'true'

      # Other integration tests may use the Release testhost apphost.
      # published TTY tests are not this job. They run on the AOT pack.
      - name: Build hypa (Release)
        run: dotnet build src/Hypa.Cli/Hypa.Cli.csproj -c Release

      - name: Test (integration)
        env:
          HYPA_BINARY_PATH: ${{ github.workspace }}/src/Hypa.Cli/bin/Release/net10.0/hypa
          HYPA_GHOSTTY_VT: ${{ github.workspace }}/native/runtimes/linux-x64/native/libghostty-vt.so
        run: >
          dotnet test tests/Hypa.IntegrationTests/Hypa.IntegrationTests.csproj
          -c Release
          --filter FullyQualifiedName!~M6PublishedAttachGoldenTests

  pi-package:
    name: Pi Package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/pi-hypa/package-lock.json

      - name: Install dependencies
        working-directory: packages/pi-hypa
        run: npm ci

      - name: Typecheck
        working-directory: packages/pi-hypa
        run: npm run build

      - name: Test
        working-directory: packages/pi-hypa
        run: npm test

      - name: Pack dry-run
        working-directory: packages/pi-hypa
        run: npm pack --dry-run

  # The npm, PyPI and Homebrew packaging first runs for real in release.yml, after
  # the GitHub release exists. Run it against a stub archive on every change.
  package-channels:
    name: Package channels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check npm, PyPI and Homebrew packaging
        run: bash scripts/test-package-channels.sh

      - name: Check install.sh package manager behavior
        run: bash scripts/test-install-script-channels.sh

  # Builds, verifies and packs the shipped archives on all four RIDs: the same
  # workflow Release runs. The clean-install hosts run on pushes, not on every
  # pull request.
  dist:
    name: Dist
    uses: ./.github/workflows/build-dist.yml
    with:
      extended-checks: true
      use-caches: true
      clean-install: ${{ github.event_name != 'pull_request' }}
