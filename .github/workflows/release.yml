name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Pushing a vX.Y.Z tag builds the tag, publishes the GitHub Release, then the
# package channels. To re-run a release by hand, dispatch it from the tag
# itself ("Use workflow from" the tag). A dry run (Actions → Release → Run
# workflow, "dry run" ticked) builds and verifies the selected branch with the
# tag's version and stages every channel, but publishes nothing.
#
# Every job that runs code from the repository is read-only: it holds no write
# scope, no OIDC token and no secret. Each channel is staged by such a job and
# published by a separate job that only downloads the staged files. Those
# publish jobs never run in a dry run, so a dry run of an unmerged branch
# cannot publish anything.
#
# The release notes come from docs/release-notes/<tag>.md when that file
# exists.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.2.3'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build and verify the selected branch, publish nothing'
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      dry-run: ${{ steps.meta.outputs.dry-run }}

    steps:
      # Every job builds the commit this run was started from. A tag push
      # starts from the tag. A dispatched release must be started from the tag
      # it names, so it builds that tag. A dry run builds the selected branch,
      # stamped with the tag's version.
      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like vX.Y.Z. Got '$tag'."
            exit 1
          fi
          if [[ "$EVENT" != push && "$DRY_RUN" != true && "$REF" != "refs/tags/$tag" ]]; then
            echo "::error::A release of $tag must be started from the tag $tag, not $REF. Choose the tag under \"Use workflow from\", or tick dry run."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "dry-run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag from $REF (dry run: $DRY_RUN)"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ -f "docs/release-notes/$TAG.md" ]]; then
            echo "Release notes: docs/release-notes/$TAG.md"
          else
            echo "::warning::docs/release-notes/$TAG.md is missing. The release will use generated notes."
          fi

  dist:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  stage-release:
    name: Stage GitHub Release
    needs: [prepare, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # SHA256SUMS lists the F1 archives and the hypa-runtime pack, the files
      # install.sh and every package channel use. The F2 archives get their
      # own SHA256SUMS-F2.
      - name: Generate checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum hypa-linux-*.tar.gz hypa-osx-*.tar.gz hypa-runtime-*.tar.gz | tee SHA256SUMS
          sha256sum hypa-f2-*.tar.gz | tee SHA256SUMS-F2
          for name in hypa-linux-x64 hypa-linux-arm64 hypa-osx-x64 hypa-osx-arm64 hypa-runtime-linux-x64; do
            grep -q " $name.tar.gz\$" SHA256SUMS || { echo "::error::SHA256SUMS does not list $name.tar.gz"; exit 1; }
          done
          for name in hypa-f2-linux-arm64 hypa-f2-osx-x64 hypa-f2-osx-arm64; do
            grep -q " $name.tar.gz\$" SHA256SUMS-F2 || { echo "::error::SHA256SUMS-F2 does not list $name.tar.gz"; exit 1; }
          done
          if grep -q 'hypa-f2-linux-x64' SHA256SUMS-F2; then
            echo "::error::Do not ship hypa-f2-linux-x64 until the H-13 residual is green"
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      # The same script writes hypa.pack-notes.txt into every archive, so the
      # release page and the in-app "what's new" show the same notes.
      - name: Write release notes
        run: |
          mkdir notes
          bash scripts/emit-mux-release-notes.sh --profile mux-release --tag "$TAG" > notes/mux-release-notes.md
          {
            echo "## $TAG assets"
            echo
            echo '```'
            (cd dist && ls -l)
            echo '```'
            echo
            cat notes/mux-release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/mux-release-notes.md
          if-no-files-found: error

  # Publishes the staged assets and notes. No checkout: nothing from the
  # repository runs while this job holds contents: write.
  publish:
    name: Publish GitHub Release
    needs: [prepare, stage-release]
    if: needs.prepare.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes/mux-release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes/mux-release-notes.md --verify-tag
          fi

      # pi-package-release.yml runs after this workflow (workflow_run) in the
      # default-branch context, so it reads the released tag from this artifact.
      - name: Record release version
        run: echo "$TAG" > release-version.txt

      - name: Upload release version
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: release-version.txt
          if-no-files-found: error

  # Package channels publish after the GitHub Release exists (and after the
  # clean installs passed), because npm and PyPI never accept a version twice.
  # Each ships the same F1 archives install.sh installs: the whole hypa-<rid>
  # directory, so hypa finds hypa-attach, hypa-runtime, hypa-pty-host and
  # libghostty-vt beside itself.
  #
  # Each channel has a read-only stage job, which runs in a dry run too, and a
  # publish job that holds the credential and only handles staged files.
  #
  # npm and PyPI trusted publishing are bound to this workflow file. Keep these
  # jobs in release.yml.
  stage-sdk:
    name: Stage Hypa.Sdk
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Pack
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: dotnet pack src/Hypa.Sdk/Hypa.Sdk.csproj -c Release -o artifacts/sdk "/p:Version=$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sdk-package
          path: artifacts/sdk/*.nupkg
          if-no-files-found: error

  publish-sdk:
    name: Publish Hypa.Sdk
    needs: [prepare, publish, stage-sdk]
    if: needs.prepare.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: sdk-package
          path: sdk

      - name: Push to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push sdk/*.nupkg
          --source https://nuget.pkg.github.com/Hypabolic/index.json
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate

  stage-npm:
    name: Stage npm packages
    needs: [prepare, stage-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Verify archives against SHA256SUMS
        run: cd dist && sha256sum --check --ignore-missing SHA256SUMS

      - name: Stage platform packages
        run: |
          set -euo pipefail
          for RID in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            bash npm/scripts/stage-platform-package.sh "$RID" "$VERSION" "dist/hypa-${RID}.tar.gz" "staging/$RID"
          done

      - name: Smoke test the linux-x64 package as npm will pack it
        run: |
          set -euo pipefail
          mkdir smoke
          npm pack ./staging/linux-x64 --pack-destination smoke --silent
          npm install --prefix smoke/prefix --ignore-scripts --no-audit --no-fund "$PWD"/smoke/*.tgz
          smoke/prefix/node_modules/@hypabolic/hypa-linux-x64/bin/hypa --version

      - name: Stage main wrapper package
        run: |
          set -euo pipefail
          STAGE="staging/hypa-main"
          mkdir -p "${STAGE}"
          jq \
            --arg version "${VERSION}" \
            'def stamp: if type == "string" and . == "0.0.0" then $version else . end;
             .version = $version |
             .optionalDependencies = (.optionalDependencies | with_entries(.value |= stamp))' \
            npm/hypa/package.json > "${STAGE}/package.json"
          cp npm/hypa/bin.js "${STAGE}/bin.js"
          cp npm/hypa/README.md "${STAGE}/README.md"

      # A tarball keeps the executable bits, which artifacts drop.
      - name: Archive staged packages
        run: tar -czf npm-staging.tar.gz staging

      - name: Upload staged packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-staging
          path: npm-staging.tar.gz
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    needs: [prepare, publish, stage-npm]
    if: needs.prepare.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download staged packages
        uses: actions/download-artifact@v4
        with:
          name: npm-staging

      - name: Unpack staged packages
        run: tar -xzf npm-staging.tar.gz

      # The platform packages go first, so the wrapper never points at a
      # version that is not on the registry yet.
      - name: Publish packages
        run: |
          set -euo pipefail
          for DIR in linux-x64 linux-arm64 osx-x64 osx-arm64 hypa-main; do
            NAME="$(jq -r .name "staging/$DIR/package.json")"
            if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]; then
              echo "${NAME}@${VERSION} is already published; skipping"
              continue
            fi
            npx --yes npm@^11 publish "./staging/$DIR" --access public --ignore-scripts
          done

  stage-pypi:
    name: Stage PyPI wheels
    needs: [prepare, stage-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build wheel

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-artifacts

      - name: Verify archives against SHA256SUMS
        run: cd dist-artifacts && sha256sum --check --ignore-missing SHA256SUMS

      - name: Build platform wheels
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          for RID in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            python python/scripts/build_wheel.py \
              --rid "$RID" \
              --version "$VERSION" \
              --artifact-dir dist-artifacts \
              --output-dir wheelhouse
          done

      - name: Smoke test the linux-x64 wheel
        run: |
          set -euo pipefail
          python -m venv smoke-venv
          smoke-venv/bin/pip install --no-index wheelhouse/*manylinux_2_34_x86_64.whl
          smoke-venv/bin/hypa --version
          # Every file over 100 MB is rejected by PyPI.
          if [ -n "$(find wheelhouse -name '*.whl' -size +99M)" ]; then
            echo "::error::A wheel is larger than the PyPI file size limit"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI wheels
    needs: [prepare, publish, stage-pypi]
    if: needs.prepare.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          skip-existing: true

  stage-homebrew:
    name: Stage Homebrew formula
    needs: [prepare, stage-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Generate formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sha() {
            value="$(awk -v name="$1" '$2 == name { print $1 }' dist/SHA256SUMS)"
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::No SHA256 for $1 in SHA256SUMS"
              exit 1
            fi
            printf '%s' "$value"
          }
          sed \
            -e "s|PLACEHOLDER_VERSION|${VERSION}|g" \
            -e "s|PLACEHOLDER_SHA_OSX_X64|$(sha hypa-osx-x64.tar.gz)|g" \
            -e "s|PLACEHOLDER_SHA_OSX_ARM64|$(sha hypa-osx-arm64.tar.gz)|g" \
            -e "s|PLACEHOLDER_SHA_LINUX_X64|$(sha hypa-linux-x64.tar.gz)|g" \
            -e "s|PLACEHOLDER_SHA_LINUX_ARM64|$(sha hypa-linux-arm64.tar.gz)|g" \
            homebrew/hypa.rb.tpl > hypa.rb
          if grep -q PLACEHOLDER hypa.rb; then
            echo "::error::Formula still has placeholders"
            exit 1
          fi
          ruby -c hypa.rb

      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: hypa.rb
          if-no-files-found: error

  publish-homebrew:
    name: Publish Homebrew tap
    needs: [prepare, publish, stage-homebrew]
    if: needs.prepare.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download formula
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: formula

      - name: Push to tap repo
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git clone --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/Hypabolic/homebrew-tap.git" \
            tap-repo
          cp formula/hypa.rb tap-repo/Formula/hypa.rb
          cd tap-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/hypa.rb
          git diff --cached --quiet || \
            (git commit -m "hypa ${VERSION}" && git push)

  # Install the formula that was just published, the way a user would.
  verify-homebrew:
    name: Verify Homebrew install (${{ matrix.os }})
    needs: [prepare, publish-homebrew]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Install from the tap
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap Hypabolic/tap
          brew install Hypabolic/tap/hypa
          brew test Hypabolic/tap/hypa
          test "$(brew list --versions hypa | awk '{print $2}')" = "$VERSION"

      - name: Run the mux
        run: |
          set -euo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          HOME="$(mktemp -d)"
          export HOME
          hypa --version
          hypa mux serve --session verify > "$HOME/serve.log" 2>&1 &
          for _ in $(seq 1 20); do
            grep -q "Control plane ready" "$HOME/serve.log" && break
            sleep 1
          done
          grep -E "vt.provider=ghostty" "$HOME/serve.log"
          hypa mux stop --session verify
