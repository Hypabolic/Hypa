name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.so
          - os: macos-15-intel
            rid: osx-x64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.dylib
          - os: macos-15
            rid: osx-arm64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.dylib
          # Windows is not a Ghostty-only F1 mux RID. No libghostty-vt.dll.
          # pack-hypa-release.ps1 fails closed on win-*. Do not publish
          # hypa-win-*.zip as a mux archive that cannot mux.

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev strace patchelf binutils

      # The markdown tree-sitter grammar is not shipped by TreeSitter.DotNet, so it
      # is compiled from source here for the matrix RID. Each runner is native-arch
      # for its RID, so no cross-compilation is needed. Directory.Build.targets then
      # copies the result into the publish output. FORCE_BUILD ignores the committed
      # linux-x64 binary so every RID is built fresh and consistently.
      - name: Build tree-sitter-markdown grammar (Linux / macOS)
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/build-tree-sitter-markdown.sh

      - name: Build tree-sitter-markdown grammar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-tree-sitter-markdown.ps1 -Force

      # Unix F1 tarball must include hypa-pty-host. Directory.Build.targets
      # copies the helper only when native/runtimes/<RID>/native/hypa-pty-host
      # exists. Do not auto-build from MSBuild. Unix F1 includes Ghostty.
      - name: Build hypa-pty-host (Unix)
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/verify-hypa-pty-host-compile.sh

      - name: Cache Zig + Ghostty source
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: native/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('native/ghostty/PIN.md') }}
          restore-keys: ghostty-${{ matrix.rid }}-

      - name: Build libghostty-vt
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/build-libghostty-vt.sh

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish src/Hypa.Cli/Hypa.Cli.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      # Fail the release if the markdown grammar did not make it into the publish
      # output — otherwise the artifact would silently ship without markdown support
      # and the provider would degrade to the regex fallback on that platform.
      - name: Verify markdown grammar in publish output
        shell: pwsh
        run: |
          $grammar = Join-Path "artifacts/publish/${{ matrix.rid }}" "${{ matrix.grammar }}"
          if (-not (Test-Path $grammar)) {
            throw "Markdown grammar missing from publish output: $grammar"
          }
          Write-Host "Verified $grammar"

      # Do not copy only two binaries. That pattern drops libe_sqlite3
      # and hypa-pty-host. and must call pack-hypa-release.
      # Unix F1 includes Ghostty. linux-x64 Ghostty AOT is the residual:
      # fail closed. Do not ship Basic.
      - name: F1 publish-tree mux-release profile
        if: runner.os != 'Windows'
        run: >
          bash scripts/verify-f1-pack-smoke.sh
          --rid ${{ matrix.rid }}
          --channel f1
          --profile mux-release
          artifacts/publish/${{ matrix.rid }}

      - name: Verify glibc 2.34 floor
        if: runner.os == 'Linux'
        run: bash scripts/verify-glibc-floor.sh "artifacts/publish/${{ matrix.rid }}"

      - name: Package F1 archive (Unix)
        if: runner.os != 'Windows'
        run: |
          extra=()
          case "${{ matrix.rid }}" in
            linux-*) extra+=(--require-store-trace) ;;
          esac
          bash scripts/pack-hypa-release.sh \
            --rid "${{ matrix.rid }}" \
            --publish-dir "artifacts/publish/${{ matrix.rid }}" \
            --name hypa \
            --out-dir artifacts/dist \
            --archive tar.gz \
            --channel f1 \
            --profile mux-release
          bash scripts/verify-f1-pack-smoke.sh \
            --rid "${{ matrix.rid }}" \
            --channel f1 \
            --profile mux-release \
            "artifacts/dist/hypa-${{ matrix.rid }}.tar.gz"
          bash scripts/verify-f1-install-smoke.sh \
            --archive "artifacts/dist/hypa-${{ matrix.rid }}.tar.gz" \
            --rid "${{ matrix.rid }}" \
            --profile mux-release \
            "${extra[@]}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: hypa-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  # Agent runtime mux binary (hypa-runtime). ships
  # linux-x64 only; expands RID matrix and install UX. Asset names use the
  # hypa-runtime-* prefix so they do not collide with compressor hypa-* archives.
  #
  # do not copy only the two binaries. Pack the staged publish dir so
  # libe_sqlite3 and Unix hypa-pty-host ship. Ghostty is F2 only.
  # and must call scripts/pack-hypa-release.sh|.ps1.
  #
  # Clang is a build-time dependency for Native AOT on Linux, not a runtime
  # dependency of the published binaries.
  build-runtime:
    name: Build runtime ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev strace patchelf binutils

      # Unix F1 runtime archive needs hypa-pty-host beside the host.
      - name: Build hypa-pty-host (Unix)
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/verify-hypa-pty-host-compile.sh

      - name: Cache Zig + Ghostty source
        uses: actions/cache@v4
        with:
          path: native/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('native/ghostty/PIN.md') }}
          restore-keys: ghostty-${{ matrix.rid }}-

      - name: Build libghostty-vt
        run: FORCE_BUILD=1 bash scripts/build-libghostty-vt.sh

      - name: Restore
        run: dotnet restore

      - name: Publish hypa-runtime
        run: >
          dotnet publish src/Hypa.AgentServer/Hypa.AgentServer.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish-runtime/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Publish hypa (smoke client)
        run: >
          dotnet publish src/Hypa.Cli/Hypa.Cli.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish-hypa-smoke/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:PublishLeanMuxSibling=false
          /p:PublishLeanAttachSibling=false
          /p:PublishLeanAnnotateSibling=false
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      # Prove wire health before packaging so a broken AOT publish cannot ship.
      # Keep hypa out of the hypa-runtime pack directory.
      - name: Smoke test runtime AOT binaries
        run: >
          bash scripts/verify-runtime-aot-smoke.sh
          artifacts/publish-runtime/${{ matrix.rid }}/hypa-runtime
          artifacts/publish-hypa-smoke/${{ matrix.rid }}/hypa

      # Do not copy only hypa-runtime.
      # Pack the full staged publish dir (SQLite native + Unix helper + Ghostty).
      # linux-x64 Ghostty AOT is the residual: fail closed. Do not ship Basic.
      # hypa-runtime is an internal debug alias. Pack smoke must pass
      # --name hypa-runtime; the default product name is hypa.
      - name: Verify glibc 2.34 floor
        if: runner.os == 'Linux'
        run: bash scripts/verify-glibc-floor.sh "artifacts/publish-runtime/${{ matrix.rid }}"

      - name: Package F1 runtime archive
        run: |
          bash scripts/pack-hypa-release.sh \
            --rid "${{ matrix.rid }}" \
            --publish-dir "artifacts/publish-runtime/${{ matrix.rid }}" \
            --name hypa-runtime \
            --out-dir artifacts/dist-runtime \
            --archive tar.gz \
            --channel f1 \
            --profile mux-release
          bash scripts/verify-f1-pack-smoke.sh \
            --rid "${{ matrix.rid }}" \
            --channel f1 \
            --name hypa-runtime \
            --profile mux-release \
            "artifacts/dist-runtime/hypa-runtime-${{ matrix.rid }}.tar.gz"

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: hypa-runtime-${{ matrix.rid }}
          path: artifacts/dist-runtime/*
          if-no-files-found: error

  # product hypa + Ghostty natives. Unix only.
  # Do not copy only two binaries. Do not reuse the F1 asset name.
  # F2 blocks the parity claim, not the F1 runtime ship.
  # linux-x64 Ghostty AOT is the residual (Zig fetch). Keep it out of
  # this hard ship matrix. Do not use continue-on-error to invent a green cell.
  build-f2:
    name: Build F2 ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev strace patchelf binutils

      - name: Cache Zig + Ghostty source
        uses: actions/cache@v4
        with:
          path: native/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('native/ghostty/PIN.md') }}
          restore-keys: ghostty-${{ matrix.rid }}-

      - name: H-15 recorded prerequisite
        run: bash scripts/verify-h15-f2-prerequisite.sh

      - name: Build tree-sitter-markdown grammar (Linux / macOS)
        run: FORCE_BUILD=1 bash scripts/build-tree-sitter-markdown.sh

      - name: Build libghostty-vt
        run: FORCE_BUILD=1 bash scripts/build-libghostty-vt.sh

      - name: Build hypa-pty-host (Unix)
        run: FORCE_BUILD=1 bash scripts/verify-hypa-pty-host-compile.sh

      - name: Restore
        run: dotnet restore

      - name: Publish hypa F2
        run: >
          dotnet publish src/Hypa.Cli/Hypa.Cli.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish-f2/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:HypaIncludeGhostty=true
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Assert libghostty-vt next to published hypa
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          case "$rid" in
            osx-*) lib="artifacts/publish-f2/${rid}/libghostty-vt.dylib" ;;
            *)     lib="artifacts/publish-f2/${rid}/libghostty-vt.so" ;;
          esac
          if [[ ! -f "$lib" ]]; then
            echo "ERROR: missing published Ghostty asset: $lib" >&2
            ls -la "artifacts/publish-f2/${rid}" >&2 || true
            exit 1
          fi
          echo "Published F2 asset OK: $lib"

      - name: H-15 RC replay against staged F2 lib
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          case "$rid" in
            osx-*) lib="artifacts/publish-f2/${rid}/libghostty-vt.dylib" ;;
            *)     lib="artifacts/publish-f2/${rid}/libghostty-vt.so" ;;
          esac
          bash scripts/verify-h15-rc-replay.sh "$lib"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$lib" | awk '{ print $1 }')"
          else
            digest="$(shasum -a 256 "$lib" | awk '{ print $1 }')"
          fi
          echo "HYPA_F2_H15_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "H-15 accepted digest for $rid: $digest"

      - name: Ghostty AOT/RC smoke on published hypa
        run: bash scripts/verify-ghostty-rc-engine.sh "artifacts/publish-f2/${{ matrix.rid }}/hypa"

      # Do not copy only two binaries. Pack the full staged publish dir.
      # F2 keeps Ghostty. Asset name is hypa-f2-<rid>.tar.gz.
      - name: F2 publish-tree mux-release profile
        run: >
          bash scripts/verify-f1-pack-smoke.sh
          --rid ${{ matrix.rid }}
          --channel f2
          --profile mux-release
          artifacts/publish-f2/${{ matrix.rid }}

      - name: Verify glibc 2.34 floor
        if: runner.os == 'Linux'
        run: bash scripts/verify-glibc-floor.sh "artifacts/publish-f2/${{ matrix.rid }}"

      - name: Package F2 archive
        run: |
          extra=()
          case "${{ matrix.rid }}" in
            linux-*) extra+=(--require-store-trace) ;;
          esac
          bash scripts/pack-hypa-release.sh \
            --rid "${{ matrix.rid }}" \
            --publish-dir "artifacts/publish-f2/${{ matrix.rid }}" \
            --name hypa \
            --out-dir artifacts/dist-f2 \
            --archive tar.gz \
            --channel f2 \
            --profile mux-release
          bash scripts/verify-f1-pack-smoke.sh \
            --rid "${{ matrix.rid }}" \
            --channel f2 \
            --profile mux-release \
            "artifacts/dist-f2/hypa-f2-${{ matrix.rid }}.tar.gz"
          bash scripts/verify-f2-install-smoke.sh \
            --archive "artifacts/dist-f2/hypa-f2-${{ matrix.rid }}.tar.gz" \
            --rid "${{ matrix.rid }}" \
            --profile mux-release \
            "${extra[@]}"

      - name: Upload F2 package
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hypa-f2-${{ matrix.rid }}
          path: artifacts/dist-f2/*
          if-no-files-found: error

  # Fresh hosts. OpenSSL 3 and the CA bundle are installed in the container.
  # libnuma is bundled.
  clean-install:
    name: Clean install matrix
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-x64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-linux-x64
          path: dist

      - name: Install on fresh Linux hosts
        run: bash scripts/verify-clean-install-matrix.sh --archive dist/hypa-linux-x64.tar.gz

  clean-install-arm64:
    name: Clean install matrix (linux-arm64)
    runs-on: ubuntu-24.04-arm
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-arm64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-linux-arm64
          path: dist

      - name: Install on fresh Linux hosts
        run: bash scripts/verify-clean-install-matrix.sh --archive dist/hypa-linux-arm64.tar.gz

  clean-install-osx-x64:
    name: Clean install (osx-x64)
    runs-on: macos-13
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download osx-x64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-osx-x64
          path: dist

      - name: Install on a clean macOS prefix
        run: bash scripts/verify-clean-install-macos.sh --archive dist/hypa-osx-x64.tar.gz

  clean-install-osx-arm64:
    name: Clean install (osx-arm64)
    runs-on: macos-14
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download osx-arm64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-osx-arm64
          path: dist

      - name: Install on a clean macOS prefix
        run: bash scripts/verify-clean-install-macos.sh --archive dist/hypa-osx-arm64.tar.gz

  # F1 checksums only. Must not wait on build-f2. Must not list hypa-f2-.
  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: [build, build-runtime]

    steps:
      - name: Download F1 compressor packages (linux)
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: hypa-linux-*

      - name: Download F1 compressor packages (osx)
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: hypa-osx-*

      - name: Download F1 runtime packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: hypa-runtime-*

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # F1 only: hypa-linux-x64.tar.gz and hypa-runtime-linux-x64.tar.gz.
          # F2 checksums live in SHA256SUMS-F2 from checksums-f2.
          ls -la
          sha256sum hypa-*.tar.gz | tee SHA256SUMS
          grep -qE '(^| )hypa-(linux|osx)-' SHA256SUMS
          grep -q 'hypa-runtime-' SHA256SUMS
          if grep -q 'hypa-f2-' SHA256SUMS; then
            echo "ERROR: F1 SHA256SUMS must not list hypa-f2- assets" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # F2 checksums. Fail closed for the F2 ship matrix. Never block F1 publish.
  checksums-f2:
    name: Generate F2 checksums
    runs-on: ubuntu-latest
    needs: [build-f2]

    steps:
      - name: Download F2 packages
        uses: actions/download-artifact@v4
        with:
          path: dist-f2
          merge-multiple: true
          pattern: hypa-f2-*

      - name: Generate SHA256SUMS-F2
        run: |
          cd dist-f2
          ls -la
          sha256sum hypa-f2-*.tar.gz | tee SHA256SUMS-F2
          grep -q 'hypa-f2-linux-arm64' SHA256SUMS-F2
          grep -q 'hypa-f2-osx-arm64' SHA256SUMS-F2
          grep -q 'hypa-f2-osx-x64' SHA256SUMS-F2
          if grep -q 'hypa-f2-linux-x64' SHA256SUMS-F2; then
            echo "ERROR: do not ship hypa-f2-linux-x64 until the H-13 residual is green" >&2
            exit 1
          fi

      - name: Upload F2 release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-f2
          path: dist-f2/*
          if-no-files-found: error

  publish-sdk:
    name: Pack & Publish Hypa.Sdk
    runs-on: ubuntu-latest
    needs: [clean-install, clean-install-arm64, clean-install-osx-x64, clean-install-osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build src/Hypa.Sdk/Hypa.Sdk.csproj
          -c Release
          /p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >
          dotnet pack src/Hypa.Sdk/Hypa.Sdk.csproj
          -c Release
          --no-build
          -o artifacts/sdk
          /p:Version=${{ steps.version.outputs.version }}

      - name: Configure GitHub Packages source
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget add source
          --username "${{ github.actor }}"
          --password "$NUGET_AUTH_TOKEN"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/Hypabolic/index.json"

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push artifacts/sdk/*.nupkg
          --source github
          --skip-duplicate

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [checksums, publish-sdk, clean-install, clean-install-arm64, clean-install-osx-x64, clean-install-osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -f "docs/release-notes/$TAG.md" ]; then
            cp "docs/release-notes/$TAG.md" mux-release-notes.md
          else
            bash scripts/emit-mux-release-notes.sh --profile mux-release --tag "$TAG" > mux-release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file mux-release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file mux-release-notes.md --verify-tag
          fi

  # F2 assets attach to the same tag after F1 publish. A F2 failure does not
  # block hypa-<rid> or hypa-runtime-<rid>.
  publish-f2:
    name: Publish F2 GitHub Release assets
    runs-on: ubuntu-latest
    needs: [checksums-f2, publish]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Download F2 release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-f2
          path: dist-f2

      - name: Publish F2 assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: F1 release $TAG is missing; publish-f2 cannot attach assets" >&2
            exit 1
          fi
          gh release upload "$TAG" dist-f2/* --clobber
