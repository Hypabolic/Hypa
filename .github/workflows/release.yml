name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.so
          - os: macos-15-intel
            rid: osx-x64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.dylib
          - os: macos-15
            rid: osx-arm64
            archive: tar.gz
            executable: hypa
            grammar: libtree-sitter-markdown.dylib
          # Windows is not a Ghostty-only F1 mux RID. No libghostty-vt.dll.
          # pack-hypa-release.ps1 fails closed on win-*. Do not publish
          # hypa-win-*.zip as a mux archive that cannot mux.

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev strace patchelf binutils

      # The markdown tree-sitter grammar is not shipped by TreeSitter.DotNet, so it
      # is compiled from source here for the matrix RID. Each runner is native-arch
      # for its RID, so no cross-compilation is needed. Directory.Build.targets then
      # copies the result into the publish output. FORCE_BUILD ignores the committed
      # linux-x64 binary so every RID is built fresh and consistently.
      - name: Build tree-sitter-markdown grammar (Linux / macOS)
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/build-tree-sitter-markdown.sh

      - name: Build tree-sitter-markdown grammar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-tree-sitter-markdown.ps1 -Force

      # Unix F1 tarball must include hypa-pty-host. Directory.Build.targets
      # copies the helper only when native/runtimes/<RID>/native/hypa-pty-host
      # exists. Do not auto-build from MSBuild. Unix F1 includes Ghostty.
      - name: Build hypa-pty-host (Unix)
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/verify-hypa-pty-host-compile.sh

      - name: Cache Zig + Ghostty source
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: native/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('native/ghostty/PIN.md') }}
          restore-keys: ghostty-${{ matrix.rid }}-

      - name: Build libghostty-vt
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/build-libghostty-vt.sh

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish src/Hypa.Cli/Hypa.Cli.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      # Fail the release if the markdown grammar did not make it into the publish
      # output — otherwise the artifact would silently ship without markdown support
      # and the provider would degrade to the regex fallback on that platform.
      - name: Verify markdown grammar in publish output
        shell: pwsh
        run: |
          $grammar = Join-Path "artifacts/publish/${{ matrix.rid }}" "${{ matrix.grammar }}"
          if (-not (Test-Path $grammar)) {
            throw "Markdown grammar missing from publish output: $grammar"
          }
          Write-Host "Verified $grammar"

      # Do not copy only two binaries. That pattern drops libe_sqlite3
      # and hypa-pty-host. and must call pack-hypa-release.
      # Unix F1 includes Ghostty. linux-x64 Ghostty AOT is the residual:
      # fail closed. Do not ship Basic.
      - name: F1 publish-tree mux-release profile
        if: runner.os != 'Windows'
        run: >
          bash scripts/verify-f1-pack-smoke.sh
          --rid ${{ matrix.rid }}
          --channel f1
          --profile mux-release
          artifacts/publish/${{ matrix.rid }}

      - name: Verify glibc 2.34 floor
        if: runner.os == 'Linux'
        run: bash scripts/verify-glibc-floor.sh "artifacts/publish/${{ matrix.rid }}"

      - name: Package F1 archive (Unix)
        if: runner.os != 'Windows'
        env:
          PACK_NOTES_TAG: ${{ steps.version.outputs.tag }}
        run: |
          extra=()
          case "${{ matrix.rid }}" in
            linux-*) extra+=(--require-store-trace) ;;
          esac
          bash scripts/pack-hypa-release.sh \
            --rid "${{ matrix.rid }}" \
            --publish-dir "artifacts/publish/${{ matrix.rid }}" \
            --name hypa \
            --out-dir artifacts/dist \
            --archive tar.gz \
            --channel f1 \
            --profile mux-release
          bash scripts/verify-f1-pack-smoke.sh \
            --rid "${{ matrix.rid }}" \
            --channel f1 \
            --profile mux-release \
            "artifacts/dist/hypa-${{ matrix.rid }}.tar.gz"
          bash scripts/verify-f1-install-smoke.sh \
            --archive "artifacts/dist/hypa-${{ matrix.rid }}.tar.gz" \
            --rid "${{ matrix.rid }}" \
            --profile mux-release \
            "${extra[@]}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: hypa-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  # Agent runtime mux binary (hypa-runtime). ships
  # linux-x64 only; expands RID matrix and install UX. Asset names use the
  # hypa-runtime-* prefix so they do not collide with compressor hypa-* archives.
  #
  # do not copy only the two binaries. Pack the staged publish dir so
  # libe_sqlite3 and Unix hypa-pty-host ship. Ghostty is F2 only.
  # and must call scripts/pack-hypa-release.sh|.ps1.
  #
  # Clang is a build-time dependency for Native AOT on Linux, not a runtime
  # dependency of the published binaries.
  build-runtime:
    name: Build runtime ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev strace patchelf binutils

      # Unix F1 runtime archive needs hypa-pty-host beside the host.
      - name: Build hypa-pty-host (Unix)
        if: runner.os != 'Windows'
        run: FORCE_BUILD=1 bash scripts/verify-hypa-pty-host-compile.sh

      - name: Cache Zig + Ghostty source
        uses: actions/cache@v4
        with:
          path: native/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('native/ghostty/PIN.md') }}
          restore-keys: ghostty-${{ matrix.rid }}-

      - name: Build libghostty-vt
        run: FORCE_BUILD=1 bash scripts/build-libghostty-vt.sh

      - name: Restore
        run: dotnet restore

      - name: Publish hypa-runtime
        run: >
          dotnet publish src/Hypa.AgentServer/Hypa.AgentServer.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish-runtime/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Publish hypa (smoke client)
        run: >
          dotnet publish src/Hypa.Cli/Hypa.Cli.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish-hypa-smoke/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:PublishLeanMuxSibling=false
          /p:PublishLeanAttachSibling=false
          /p:PublishLeanAnnotateSibling=false
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      # Prove wire health before packaging so a broken AOT publish cannot ship.
      # Keep hypa out of the hypa-runtime pack directory.
      - name: Smoke test runtime AOT binaries
        run: >
          bash scripts/verify-runtime-aot-smoke.sh
          artifacts/publish-runtime/${{ matrix.rid }}/hypa-runtime
          artifacts/publish-hypa-smoke/${{ matrix.rid }}/hypa

      # Do not copy only hypa-runtime.
      # Pack the full staged publish dir (SQLite native + Unix helper + Ghostty).
      # linux-x64 Ghostty AOT is the residual: fail closed. Do not ship Basic.
      # hypa-runtime is an internal debug alias. Pack smoke must pass
      # --name hypa-runtime; the default product name is hypa.
      - name: Verify glibc 2.34 floor
        if: runner.os == 'Linux'
        run: bash scripts/verify-glibc-floor.sh "artifacts/publish-runtime/${{ matrix.rid }}"

      - name: Package F1 runtime archive
        env:
          PACK_NOTES_TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash scripts/pack-hypa-release.sh \
            --rid "${{ matrix.rid }}" \
            --publish-dir "artifacts/publish-runtime/${{ matrix.rid }}" \
            --name hypa-runtime \
            --out-dir artifacts/dist-runtime \
            --archive tar.gz \
            --channel f1 \
            --profile mux-release
          bash scripts/verify-f1-pack-smoke.sh \
            --rid "${{ matrix.rid }}" \
            --channel f1 \
            --name hypa-runtime \
            --profile mux-release \
            "artifacts/dist-runtime/hypa-runtime-${{ matrix.rid }}.tar.gz"

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: hypa-runtime-${{ matrix.rid }}
          path: artifacts/dist-runtime/*
          if-no-files-found: error

  # product hypa + Ghostty natives. Unix only.
  # Do not copy only two binaries. Do not reuse the F1 asset name.
  # F2 blocks the parity claim, not the F1 runtime ship.
  # linux-x64 Ghostty AOT is the residual (Zig fetch). Keep it out of
  # this hard ship matrix. Do not use continue-on-error to invent a green cell.
  build-f2:
    name: Build F2 ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev strace patchelf binutils

      - name: Cache Zig + Ghostty source
        uses: actions/cache@v4
        with:
          path: native/ghostty/.cache
          key: ghostty-${{ matrix.rid }}-${{ hashFiles('native/ghostty/PIN.md') }}
          restore-keys: ghostty-${{ matrix.rid }}-

      - name: H-15 recorded prerequisite
        run: bash scripts/verify-h15-f2-prerequisite.sh

      - name: Build tree-sitter-markdown grammar (Linux / macOS)
        run: FORCE_BUILD=1 bash scripts/build-tree-sitter-markdown.sh

      - name: Build libghostty-vt
        run: FORCE_BUILD=1 bash scripts/build-libghostty-vt.sh

      - name: Build hypa-pty-host (Unix)
        run: FORCE_BUILD=1 bash scripts/verify-hypa-pty-host-compile.sh

      - name: Restore
        run: dotnet restore

      - name: Publish hypa F2
        run: >
          dotnet publish src/Hypa.Cli/Hypa.Cli.csproj
          -r ${{ matrix.rid }}
          -c Release
          -o artifacts/publish-f2/${{ matrix.rid }}
          /m:1
          /p:BuildInParallel=false
          /p:HypaIncludeGhostty=true
          /p:Version=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Assert libghostty-vt next to published hypa
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          case "$rid" in
            osx-*) lib="artifacts/publish-f2/${rid}/libghostty-vt.dylib" ;;
            *)     lib="artifacts/publish-f2/${rid}/libghostty-vt.so" ;;
          esac
          if [[ ! -f "$lib" ]]; then
            echo "ERROR: missing published Ghostty asset: $lib" >&2
            ls -la "artifacts/publish-f2/${rid}" >&2 || true
            exit 1
          fi
          echo "Published F2 asset OK: $lib"

      - name: H-15 RC replay against staged F2 lib
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          case "$rid" in
            osx-*) lib="artifacts/publish-f2/${rid}/libghostty-vt.dylib" ;;
            *)     lib="artifacts/publish-f2/${rid}/libghostty-vt.so" ;;
          esac
          bash scripts/verify-h15-rc-replay.sh "$lib"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$lib" | awk '{ print $1 }')"
          else
            digest="$(shasum -a 256 "$lib" | awk '{ print $1 }')"
          fi
          echo "HYPA_F2_H15_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "H-15 accepted digest for $rid: $digest"

      - name: Ghostty AOT/RC smoke on published hypa
        run: bash scripts/verify-ghostty-rc-engine.sh "artifacts/publish-f2/${{ matrix.rid }}/hypa"

      # Do not copy only two binaries. Pack the full staged publish dir.
      # F2 keeps Ghostty. Asset name is hypa-f2-<rid>.tar.gz.
      # The packed archive is verified below. The publish tree has no NOTICE or
      # hypa.channel until the packer adds them, so it is not checked here.

      - name: Verify glibc 2.34 floor
        if: runner.os == 'Linux'
        run: bash scripts/verify-glibc-floor.sh "artifacts/publish-f2/${{ matrix.rid }}"

      - name: Package F2 archive
        env:
          PACK_NOTES_TAG: ${{ steps.version.outputs.tag }}
        run: |
          extra=()
          case "${{ matrix.rid }}" in
            linux-*) extra+=(--require-store-trace) ;;
          esac
          bash scripts/pack-hypa-release.sh \
            --rid "${{ matrix.rid }}" \
            --publish-dir "artifacts/publish-f2/${{ matrix.rid }}" \
            --name hypa \
            --out-dir artifacts/dist-f2 \
            --archive tar.gz \
            --channel f2 \
            --profile mux-release
          bash scripts/verify-f1-pack-smoke.sh \
            --rid "${{ matrix.rid }}" \
            --channel f2 \
            --profile mux-release \
            "artifacts/dist-f2/hypa-f2-${{ matrix.rid }}.tar.gz"
          bash scripts/verify-f2-install-smoke.sh \
            --archive "artifacts/dist-f2/hypa-f2-${{ matrix.rid }}.tar.gz" \
            --rid "${{ matrix.rid }}" \
            --profile mux-release \
            "${extra[@]}"

      - name: Upload F2 package
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hypa-f2-${{ matrix.rid }}
          path: artifacts/dist-f2/*
          if-no-files-found: error

  # Fresh hosts. OpenSSL 3 and the CA bundle are installed in the container.
  # libnuma is bundled.
  clean-install:
    name: Clean install matrix
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-x64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-linux-x64
          path: dist

      - name: Install on fresh Linux hosts
        run: bash scripts/verify-clean-install-matrix.sh --archive dist/hypa-linux-x64.tar.gz

  clean-install-arm64:
    name: Clean install matrix (linux-arm64)
    runs-on: ubuntu-24.04-arm
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-arm64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-linux-arm64
          path: dist

      - name: Install on fresh Linux hosts
        run: bash scripts/verify-clean-install-matrix.sh --archive dist/hypa-linux-arm64.tar.gz

  clean-install-osx-x64:
    name: Clean install (osx-x64)
    runs-on: macos-15-intel
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download osx-x64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-osx-x64
          path: dist

      - name: Install on a clean macOS prefix
        run: bash scripts/verify-clean-install-macos.sh --archive dist/hypa-osx-x64.tar.gz

  clean-install-osx-arm64:
    name: Clean install (osx-arm64)
    runs-on: macos-14
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download osx-arm64 F1 pack
        uses: actions/download-artifact@v4
        with:
          name: hypa-osx-arm64
          path: dist

      - name: Install on a clean macOS prefix
        run: bash scripts/verify-clean-install-macos.sh --archive dist/hypa-osx-arm64.tar.gz

  # F1 checksums only. Must not wait on build-f2. Must not list hypa-f2-.
  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: [build, build-runtime]

    steps:
      - name: Download F1 compressor packages (linux)
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: hypa-linux-*

      - name: Download F1 compressor packages (osx)
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: hypa-osx-*

      - name: Download F1 runtime packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: hypa-runtime-*

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # F1 only: hypa-linux-x64.tar.gz and hypa-runtime-linux-x64.tar.gz.
          # F2 checksums live in SHA256SUMS-F2 from checksums-f2.
          ls -la
          sha256sum hypa-*.tar.gz | tee SHA256SUMS
          grep -qE '(^| )hypa-(linux|osx)-' SHA256SUMS
          grep -q 'hypa-runtime-' SHA256SUMS
          if grep -q 'hypa-f2-' SHA256SUMS; then
            echo "ERROR: F1 SHA256SUMS must not list hypa-f2- assets" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # F2 checksums. Fail closed for the F2 ship matrix. Never block F1 publish.
  checksums-f2:
    name: Generate F2 checksums
    runs-on: ubuntu-latest
    needs: [build-f2]

    steps:
      - name: Download F2 packages
        uses: actions/download-artifact@v4
        with:
          path: dist-f2
          merge-multiple: true
          pattern: hypa-f2-*

      - name: Generate SHA256SUMS-F2
        run: |
          cd dist-f2
          ls -la
          sha256sum hypa-f2-*.tar.gz | tee SHA256SUMS-F2
          grep -q 'hypa-f2-linux-arm64' SHA256SUMS-F2
          grep -q 'hypa-f2-osx-arm64' SHA256SUMS-F2
          grep -q 'hypa-f2-osx-x64' SHA256SUMS-F2
          if grep -q 'hypa-f2-linux-x64' SHA256SUMS-F2; then
            echo "ERROR: do not ship hypa-f2-linux-x64 until the H-13 residual is green" >&2
            exit 1
          fi

      - name: Upload F2 release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-f2
          path: dist-f2/*
          if-no-files-found: error

  publish-sdk:
    name: Pack & Publish Hypa.Sdk
    runs-on: ubuntu-latest
    needs: [clean-install, clean-install-arm64, clean-install-osx-x64, clean-install-osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches repo global.json (10.0.400, rollForward latestPatch).
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build src/Hypa.Sdk/Hypa.Sdk.csproj
          -c Release
          /p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >
          dotnet pack src/Hypa.Sdk/Hypa.Sdk.csproj
          -c Release
          --no-build
          -o artifacts/sdk
          /p:Version=${{ steps.version.outputs.version }}

      - name: Configure GitHub Packages source
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget add source
          --username "${{ github.actor }}"
          --password "$NUGET_AUTH_TOKEN"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/Hypabolic/index.json"

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push artifacts/sdk/*.nupkg
          --source github
          --skip-duplicate

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [checksums, publish-sdk, clean-install, clean-install-arm64, clean-install-osx-x64, clean-install-osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # pi-package-release.yml runs after this workflow (workflow_run) in the
      # default-branch context, so it reads the released tag from this artifact.
      - name: Record release version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "$TAG" > release-version.txt

      - name: Upload release version
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: release-version.txt
          if-no-files-found: error

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash scripts/emit-mux-release-notes.sh --profile mux-release --tag "$TAG" > mux-release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file mux-release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file mux-release-notes.md --verify-tag
          fi

  # F2 assets attach to the same tag after F1 publish. A F2 failure does not
  # block hypa-<rid> or hypa-runtime-<rid>.
  publish-f2:
    name: Publish F2 GitHub Release assets
    runs-on: ubuntu-latest
    needs: [checksums-f2, publish]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z. Got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Download F2 release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-f2
          path: dist-f2

      - name: Publish F2 assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: F1 release $TAG is missing; publish-f2 cannot attach assets" >&2
            exit 1
          fi
          gh release upload "$TAG" dist-f2/* --clobber

  # Package-manager channels. Each one ships the same F1 archives that install.sh
  # installs: the whole hypa-<rid> directory, so hypa finds hypa-attach, hypa-runtime,
  # hypa-pty-host and libghostty-vt beside itself. They run after the GitHub Release
  # exists (and after the clean-install matrix passed), because npm and PyPI never
  # accept a version twice. The mux ships for Linux and macOS only.
  #
  # npm and PyPI trusted publishing are bound to this workflow file. Keep these jobs
  # in release.yml.
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z. Got '$tag'." }
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Verify archives against SHA256SUMS
        run: cd dist && sha256sum --check --ignore-missing SHA256SUMS

      - name: Stage platform packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for RID in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            bash npm/scripts/stage-platform-package.sh "$RID" "$VERSION" "dist/hypa-${RID}.tar.gz" "staging/$RID"
          done

      - name: Smoke test the linux-x64 package as npm will pack it
        run: |
          set -euo pipefail
          mkdir smoke
          npm pack ./staging/linux-x64 --pack-destination smoke --silent
          npm install --prefix smoke/prefix --ignore-scripts --no-audit --no-fund "$PWD"/smoke/*.tgz
          smoke/prefix/node_modules/@hypabolic/hypa-linux-x64/bin/hypa --version

      - name: Publish platform packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for RID in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            NAME="$(jq -r .name "staging/$RID/package.json")"
            if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]; then
              echo "${NAME}@${VERSION} is already published; skipping"
              continue
            fi
            npx --yes npm@^11 publish "./staging/$RID" --access public
          done

      - name: Publish main wrapper package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$(npm view "@hypabolic/hypa@${VERSION}" version 2>/dev/null)" ]; then
            echo "@hypabolic/hypa@${VERSION} is already published; skipping"
            exit 0
          fi

          STAGE="staging/hypa-main"
          mkdir -p "${STAGE}"

          jq \
            --arg version "${VERSION}" \
            'def stamp: if type == "string" and . == "0.0.0" then $version else . end;
             .version = $version |
             .optionalDependencies = (.optionalDependencies | with_entries(.value |= stamp))' \
            npm/hypa/package.json > "${STAGE}/package.json"

          cp npm/hypa/bin.js "${STAGE}/bin.js"
          cp npm/hypa/README.md "${STAGE}/README.md"

          npx --yes npm@^11 publish "./${STAGE}" --access public

  publish-pypi:
    name: Publish PyPI wheels
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z. Got '$tag'." }
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build wheel

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-artifacts

      - name: Verify archives against SHA256SUMS
        run: cd dist-artifacts && sha256sum --check --ignore-missing SHA256SUMS

      - name: Build platform wheels
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          for RID in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            python python/scripts/build_wheel.py \
              --rid "$RID" \
              --version "$VERSION" \
              --artifact-dir dist-artifacts \
              --output-dir wheelhouse
          done

      - name: Smoke test the linux-x64 wheel
        run: |
          set -euo pipefail
          python -m venv smoke-venv
          smoke-venv/bin/pip install --no-index wheelhouse/*manylinux_2_34_x86_64.whl
          smoke-venv/bin/hypa --version
          # Every file over 100 MB is rejected by PyPI.
          if [ -n "$(find wheelhouse -name '*.whl' -size +99M)" ]; then
            echo "::error::A wheel is larger than the PyPI file size limit"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          skip-existing: true

  publish-homebrew:
    name: Publish Homebrew tap
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z. Got '$tag'." }
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Generate formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha() {
            value="$(awk -v name="$1" '$2 == name { print $1 }' dist/SHA256SUMS)"
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::No SHA256 for $1 in SHA256SUMS"
              exit 1
            fi
            printf '%s' "$value"
          }
          sed \
            -e "s|PLACEHOLDER_VERSION|${VERSION}|g" \
            -e "s|PLACEHOLDER_SHA_OSX_X64|$(sha hypa-osx-x64.tar.gz)|g" \
            -e "s|PLACEHOLDER_SHA_OSX_ARM64|$(sha hypa-osx-arm64.tar.gz)|g" \
            -e "s|PLACEHOLDER_SHA_LINUX_X64|$(sha hypa-linux-x64.tar.gz)|g" \
            -e "s|PLACEHOLDER_SHA_LINUX_ARM64|$(sha hypa-linux-arm64.tar.gz)|g" \
            homebrew/hypa.rb.tpl > formula-staging.rb
          if grep -q PLACEHOLDER formula-staging.rb; then
            echo "::error::Formula still has placeholders"
            exit 1
          fi
          ruby -c formula-staging.rb

      - name: Push to tap repo
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/Hypabolic/homebrew-tap.git" \
            tap-repo
          cp formula-staging.rb tap-repo/Formula/hypa.rb
          cd tap-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/hypa.rb
          git diff --cached --quiet || \
            (git commit -m "hypa ${VERSION}" && git push)

  # Install the formula that was just published, the way a user would.
  verify-homebrew:
    name: Verify Homebrew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [publish-homebrew]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z. Got '$tag'." }
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Install from the tap
        run: |
          set -euo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap Hypabolic/tap
          brew install Hypabolic/tap/hypa
          brew test Hypabolic/tap/hypa
          test "$(brew list --versions hypa | awk '{print $2}')" = "${{ steps.version.outputs.version }}"

      - name: Run the mux
        run: |
          set -euo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          HOME="$(mktemp -d)"
          export HOME
          hypa --version
          hypa mux serve --session verify > "$HOME/serve.log" 2>&1 &
          for _ in $(seq 1 20); do
            grep -q "Control plane ready" "$HOME/serve.log" && break
            sleep 1
          done
          grep -E "vt.provider=ghostty" "$HOME/serve.log"
          hypa mux stop --session verify
