[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypa"
dynamic = ["version"]
description = "Workspace mux and local context runtime for coding agents"
readme = "README.md"
license = { text = "FSL-1.1-ALv2" }
requires-python = ">=3.9"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/Hypabolic/Hypa"

[project.scripts]
hypa = "hypa._runner:main"

[tool.hatch.version]
path = "hypa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hypa"]
